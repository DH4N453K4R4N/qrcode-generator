<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
body {
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    background: linear-gradient(135deg, #667eea, #764ba2); /* Cool gradient */
}

.container {
    background-color:#fff;
    width:100%;
    max-width:400px;
    border-radius:16px;
    padding:30px 25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    text-align:center;
}

h1 {
    font-size:24px;
    margin-bottom:20px;
    font-weight:600;
    color:#333;
}

input {
    width:100%;
    padding:14px;
    font-size:16px;
    border-radius:10px;
    border:1px solid #ddd;
    outline:none;
    margin-bottom:20px;
    transition:0.3s;
}

input:focus {
    border-color:#667eea;
    box-shadow:0 0 8px rgba(102,126,234,0.3);
}

.color-picker {
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.color-circle {
    width:36px;
    height:36px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid #fff;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
    transition: transform 0.2s, box-shadow 0.2s;
}

.color-circle:hover {
    transform:scale(1.1);
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
}

.color-circle.selected {
    border:3px solid #000;
}

#customColor {
    width:36px;
    height:36px;
    border-radius:50%;
    border:2px solid #fff;
    cursor:pointer;
    padding:0;
}

.buttons {
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button {
    flex:1;
    min-width:130px;
    padding:12px 20px;
    font-size:15px;
    font-weight:600;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
    color:#fff;
}

button:active { transform:scale(0.97); }

#generate { background-color:#667eea; }
#generate:hover { background-color:#5a67d8; }

#download { background-color:#764ba2; }
#download:hover { background-color:#623aa2; }

#qrcode {
    padding:20px;
    background-color:#f9f9f9;
    border-radius:12px;
    display:inline-block;
    box-shadow:inset 0 0 5px rgba(0,0,0,0.05);
    transition:opacity 0.3s ease;
}

@media (max-width:450px){
    h1{font-size:22px;}
    input{font-size:14px;padding:12px;}
    button{font-size:14px;min-width:120px;padding:10px;}
    #qrcode{padding:15px;}
    .color-circle,#customColor{width:30px;height:30px;}
}
</style>
</head>
<body>

<div class="container">
    <h1>QR Code Generator</h1>
    <input type="text" id="text" placeholder="Enter text or URL">
    
    <div class="color-picker">
        <div class="color-circle" data-color="#000000" style="background-color:#000000"></div>
        <div class="color-circle" data-color="#e74c3c" style="background-color:#e74c3c"></div>
        <div class="color-circle" data-color="#8b4513" style="background-color:#8b4513"></div>
        <div class="color-circle" data-color="#f1c40f" style="background-color:#f1c40f"></div>
        <div class="color-circle" data-color="#3498db" style="background-color:#3498db"></div>
        <input type="color" id="customColor" value="#000000" title="Custom Color">
    </div>

    <div class="buttons">
        <button id="generate">Generate</button>
        <button id="download">Download</button>
    </div>
    <div id="qrcode"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let qrCode;
let selectedColor = "#000000"; // default color
const qrContainer = document.getElementById("qrcode");
const input = document.getElementById("text");
const colorCircles = document.querySelectorAll('.color-circle');
const customColorInput = document.getElementById("customColor");

// Handle color circle selection
colorCircles.forEach(circle=>{
    circle.addEventListener('click', ()=>{
        colorCircles.forEach(c=>c.classList.remove('selected'));
        circle.classList.add('selected');
        selectedColor = circle.dataset.color;
        customColorInput.value = selectedColor; // sync custom color
    });
});

// Handle custom color input
customColorInput.addEventListener('input', ()=>{
    colorCircles.forEach(c=>c.classList.remove('selected'));
    selectedColor = customColorInput.value;
});

// Generate QR
function generateQRCode(){
    const text = input.value.trim();
    qrContainer.innerHTML = "";
    if(!text){ alert("Please enter text or URL!"); return; }

    const size = Math.min(window.innerWidth*0.6, 200);
    qrCode = new QRCode(qrContainer,{
        text: text,
        width: size,
        height: size,
        colorDark: selectedColor,
        colorLight: "#ffffff"
    });
}

document.getElementById("generate").addEventListener("click", generateQRCode);

// Download QR
document.getElementById("download").addEventListener("click", ()=>{
    if(!qrCode){ alert("Please generate a QR code first!"); return; }
    const img = qrContainer.querySelector('img');
    if(img){
        const link = document.createElement('a');
        link.href = img.src;
        link.download = "qrcode.png";
        link.click();
    } else {
        alert("QR code not available for download!");
    }
});
</script>

</body>
</html>
